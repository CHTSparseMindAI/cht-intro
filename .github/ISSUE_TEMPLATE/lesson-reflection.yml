name: Lesson reflection
description: Submit a short reflection after completing a lesson.
title: "[Reflection] "
labels: ["reflection", "course"]
body:
  - type: input
    id: lesson
    attributes:
      label: Lesson
      placeholder: "Example: 04 - The CHT Learning Loop"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: My summary
      description: Explain the lesson in your own words.
    validations:
      required: true
  - type: textarea
    id: application
    attributes:
      label: How this applies to SparseMind
      description: Connect the lesson to research, engineering, product, or BD.
    validations:
      required: true
  - type: textarea
    id: confusion
    attributes:
      label: Open questions
      description: What should the team clarify?

